<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#003399">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/jpeg" href="x-ray.png">
    <link rel="apple-touch-icon" href="x-ray.png">
    <link rel="manifest" href="manifest.json">
    <title>Scanner F-CGO-004 - Azul Cargo</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 15px; background-color: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        h2 { color: #003399; margin-bottom: 5px; }
        
        /* Contador e Barra de Progresso */
        .count-box { background: #eef2ff; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #d1d9e6; }
        .progress-container { background-color: #ddd; border-radius: 10px; height: 10px; width: 100%; margin-top: 8px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background-color: #28a745; transition: width 0.3s; }

        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        #reader { width: 100%; border-radius: 12px; margin-top: 10px; background: #000; }
        
        button { width: 100%; padding: 15px; margin-top: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-camera { background-color: #003399; color: white; }
        .btn-pdf { background-color: #d9534f; color: white; }
        .btn-limpar { background-color: #f0ad4e; color: white; }
        
               /* Botão quando está desabilitado */
        .btn-limpar:disabled {
          background-color: #cccccc;
          cursor: not-allowed;
          opacity: 0.7;
         }

         #status { margin-top: 15px; font-weight: bold; min-height: 20px; }
        
    </style>
</head>
<body>

<div class="card">
    <h2>Scanner Azul Cargo</h2>
    <p style="font-size: 12px; margin-bottom: 15px;">Inspecção de Carga F-CGO-004</p>

    <div class="count-box">
        <strong>Itens Bipados:</strong> <span id="contagem">0</span> / 21
        <div class="progress-container">
            <div id="barra" class="progress-bar"></div>
        </div>
    </div>

    <input type="text" id="nome" placeholder="Nome do APAC">
    <input type="text" id="re" placeholder="RE">
    
    <div id="reader"></div>
    
   <button onclick="alternarEntradaManual()" id="btnManual" 
        style="margin-top: 15px; background: none; border: 1px solid #003399; color: #003399; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold;">
    ⌨️ Entrada Manual de Dados
</button>

<div id="manual-input-container" style="display: none; margin-top: 15px; flex-direction: column; align-items: center; gap: 10px; background: #f8f9fa; padding: 15px; border-radius: 12px; border: 1px solid #ddd;">
    
    <input type="text" id="m-codigo" placeholder="CTE ou Saco Coletor (B/C)" style="width: 90%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
    
    <input type="text" id="m-destino" placeholder="Destino (D)" style="width: 90%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
    
    <div style="display: flex; gap: 5px; width: 95%; justify-content: center;">
        <input type="number" id="m-total" placeholder="Qtd Total (E)" style="width: 45%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
        <input type="number" id="m-inspec" placeholder="Qtd Inspec (F)" style="width: 45%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
    </div>

    <div style="display: flex; gap: 10px; width: 95%; margin-top: 5px;">
        <button onclick="processarManual()" style="flex: 2; padding: 12px; background-color: #003399; color: white; border: none; border-radius: 8px; font-weight: bold;">GRAVAR DADOS</button>
        <button onclick="alternarEntradaManual()" style="flex: 1; padding: 12px; background-color: #666; color: white; border: none; border-radius: 8px;">VOLTAR</button>
    </div>
</div>
    
    <button class="btn-camera" id="btnAcao" onclick="toggleCamera()">LER QRCODE</button>
    
    <div id="status"></div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
    
    <button class="btn-pdf" style="background-color: #28a745;" onclick="encerrarTurno()">ENCERRAR TURNO</button>
    <button id="btnLimpar" class="btn-limpar" onclick="confirmarLimpeza()" disabled>LIMPAR PLANILHA</button>
</div>

<script>
    // --- CONFIGURAÇÃO ---
    const scriptURL = 'https://script.google.com/macros/s/AKfycbx30Iexme5VNbrHuCvhtO4Xb1tAV9-n11SR5BoZ8JzRGCSCHebDvTB_zyZQNt4Wm5pa8g/exec'; 
    const sheetID = '1W8tabvUvJ9v2MBml0vbBlpBI12cdBDXAU5jQLrfhVik';
    let html5QrCode;
    let cameraAtiva = false;

    // Função para mostrar/esconder o campo de digitação
function alternarEntradaManual() {
    const container = document.getElementById('manual-input-container');
    const btnManual = document.getElementById('btnManual');
    
    if (container.style.display === "none") {
        container.style.display = "flex";
        btnManual.style.display = "none";
        document.getElementById('m-codigo').focus();
    } else {
        container.style.display = "none";
        btnManual.style.display = "inline-block";
    }
}

function processarManual() {
    // Coleta os valores do formulário
    const codigo = document.getElementById('m-codigo').value.trim().toUpperCase();
    const destino = document.getElementById('m-destino').value.trim().toUpperCase();
    const qtdTotal = document.getElementById('m-total').value;
    const qtdInspec = document.getElementById('m-inspec').value;

    // Validação básica
    if (!codigo || !destino || !qtdTotal || !qtdInspec) {
        alert("Por favor, preencha TODOS os campos antes de gravar.");
        return;
    }

    // Define o tipo baseado no código (lógica que você já usa no script)
    const tipo = codigo.startsWith("577") ? "577" : "SACO";

    // Monta o objeto de dados exatamente como o scanner faz
    const dadosManuais = {
        data: new Date().toLocaleString('pt-BR'),
        cte: codigo,
        destino: destino,
        qtdTotal: qtdTotal,
        qtdInspec: qtdInspec,
        tipo: tipo,
        nome: document.getElementById('nome').value, // Pega do cabeçalho
        re: document.getElementById('re').value,     // Pega do cabeçalho
        confirmarRepetido: false
    };

    // Envia diretamente para a função de comunicação com a planilha
    // Nota: Certifique-se que o nome da função que envia para o Google é 'enviarParaPlanilha'
    enviarParaPlanilha(dadosManuais);

    // Limpa os campos e fecha o painel manual
    document.getElementById('m-codigo').value = "";
    document.getElementById('m-destino').value = "";
    document.getElementById('m-total').value = "";
    document.getElementById('m-inspec').value = "";
    alternarEntradaManual();
}

    // Adicione isso dentro da tag <script>, logo após as definições de scriptURL
window.onload = function() {
    // Busca a contagem atual da planilha ao iniciar
    fetch(scriptURL + '?action=getContagem')
    .then(r => r.text())
    .then(res => {
        atualizarContador(res);
    });
};

function atualizarContador(valor) {
    const n = parseInt(valor);
    document.getElementById('contagem').innerText = n;
    
    const porcentagem = (n / 21) * 100;
    const barra = document.getElementById('barra');
    const botaoLimpar = document.getElementById('btnLimpar');
    
    barra.style.width = porcentagem + "%";
    
    // CORREÇÃO: Habilita o botão se a planilha já estiver com 21 ou mais
    if (n >= 21) {
        botaoLimpar.disabled = false;
        barra.style.backgroundColor = "#003399";
    } else {
        botaoLimpar.disabled = true;
        if (n >= 18) barra.style.backgroundColor = "#d9534f";
        else if (n >= 10) barra.style.backgroundColor = "#f0ad4e";
        else barra.style.backgroundColor = "#28a745";
    }
}

    function toggleCamera() {
        if (!cameraAtiva) {
            if(!document.getElementById('nome').value || !document.getElementById('re').value) {
                alert("Por favor, preencha o Nome e RE."); return;
            }
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess)
            .then(() => {
                cameraAtiva = true;
                document.getElementById('btnAcao').innerText = "DESLIGAR CÂMERA";
            });
        } else { pararCamera(); }
    }

    function pararCamera() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                cameraAtiva = false;
                document.getElementById('btnAcao').innerText = "LER QRCODE";
            }).catch(() => { cameraAtiva = false; });
        }
    }

    function onScanSuccess(decodedText) {
    pararCamera();
    
    let cte, destino, qtdTotal, tipo;
    const texto = decodedText.trim();
    const partes = texto.split('|');

    // 1. VERIFICA SE É O PADRÃO DE ORIGEM (Ex: FOR-0013339 ou VIX-...)
    // Se começar com letra e tiver pipes, tratamos como o novo padrão
    if (texto.match(/^[A-Z]/) && partes.length > 1) {
        tipo = "SACO";
        cte = partes[0]; 
        
        // Busca o destino: procuramos o índice que contenha "SACO" ou "COLETOR"
        let idxSaco = partes.findIndex(p => p.toUpperCase().includes("SACO"));
        
        if (idxSaco !== -1 && idxSaco >= 2) {
            // Se achou "SACO", o destino está duas posições antes (pulando a data)
            destino = partes[idxSaco - 2]; 
        } else {
            // Caso a estrutura varie, tenta pegar a 3ª parte (índice 2) que é o padrão
            destino = partes[2] || "N/I";
        }
        qtdTotal = "1";
    } 
    // 2. VERIFICA SE É O PADRÃO ANTIGO (Começa com 577)
    else if (texto.startsWith("577")) {
        tipo = "577";
        let cteMatch = texto.match(/577(\d{8})/);
        let rotaMatch = texto.match(/[A-Z0-9]{3,7}-([A-Z0-9]{3,7})\|(\d+)\|/);
        
        cte = cteMatch ? cteMatch[1] : texto.substring(0, 11);
        destino = rotaMatch ? rotaMatch[1] : "N/I"; 
        qtdTotal = rotaMatch ? rotaMatch[2] : "0";
    } 
    else {
        alert("Padrão não reconhecido: " + texto);
        return;
    }

    let qtdInspec = prompt(`ID/CTE: ${cte}\nDestino: ${destino}\nVolumes: ${qtdTotal}\n\nVolumes inspecionados?`, "1");
    if (qtdInspec === null) return;

    // Dentro de onScanSuccess...
const dados = {
    data: new Date().toLocaleString('pt-BR'), 
    cte: cte, 
    destino: destino, 
    qtdTotal: qtdTotal, 
    qtdInspec: qtdInspec,
    tipo: tipo,
    nome: document.getElementById('nome').value, 
    re: document.getElementById('re').value,
    confirmarRepetido: false // Padrão é falso
};

function enviarParaPlanilha(objetoDados) {
    document.getElementById('status').innerText = "Enviando...";
    
    fetch(scriptURL, { method: 'POST', body: JSON.stringify(objetoDados) })
    .then(r => r.text())
    .then(res => {
        if (res === "REPETIDO") {
            if (confirm(`O código ${cte} já está na planilha.\nRegistrar novamente?`)) {
                objetoDados.confirmarRepetido = true; // Ativa a permissão
                enviarParaPlanilha(objetoDados); // Tenta de novo
            } else {
                document.getElementById('status').innerText = "Cancelado";
            }
        } else if (res === "CHEIA") {
            alert("Limite de 21 linhas atingido!");
        } else {
            atualizarContador(res);
            document.getElementById('status').innerText = "✅ Registrado (" + res + "/21)";
        }
    });
}

enviarParaPlanilha(dados);
}

    function atualizarContador(valor) {
        const n = parseInt(valor);
        document.getElementById('contagem').innerText = n;
        const porcentagem = (n / 21) * 100;
        const barra = document.getElementById('barra');
        barra.style.width = porcentagem + "%";
        
        if(n >= 18) barra.style.backgroundColor = "#d9534f";
        else if(n >= 10) barra.style.backgroundColor = "#f0ad4e";
        else barra.style.backgroundColor = "#28a745";
    }


    function atualizarContador(valor) {
    const n = parseInt(valor);
    document.getElementById('contagem').innerText = n;
    
    const porcentagem = (n / 21) * 100;
    const barra = document.getElementById('barra');
    const botaoLimpar = document.getElementById('btnLimpar');
    
    barra.style.width = porcentagem + "%";
    
    // Habilita o botão apenas se chegar em 21
    if (n >= 21) {
        botaoLimpar.disabled = false;
        barra.style.backgroundColor = "#003399"; // Cor de "concluído"
    } else {
        botaoLimpar.disabled = true;
        // Cores da barra conforme o progresso
        if (n >= 18) barra.style.backgroundColor = "#d9534f";
        else if (n >= 10) barra.style.backgroundColor = "#f0ad4e";
        else barra.style.backgroundColor = "#28a745";
    }
}

    
    function confirmarLimpeza() {
        if (confirm("Tens a certeza que desejas LIMPAR os dados da planilha?")) {
            const status = document.getElementById('status');
            status.innerText = "Limpando...";
            fetch(scriptURL + '?action=limpar', { mode: 'no-cors' })
            .then(() => {
                atualizarContador(0);
                status.style.color = "green";
                status.innerText = "✅ Planilha Limpa!";
                setTimeout(() => { status.innerText = ""; }, 2500);
            });
        }
    }

    function encerrarTurno() {
    const nome = document.getElementById('nome').value;
    const re = document.getElementById('re').value;

    if (!nome || !re) {
        alert("Por favor, preencha Nome e RE para encerrar o turno.");
        return;
    }

    if (confirm("Deseja realmente ENCERRAR O TURNO?\n\nIsso irá arquivar os dados atuais e limpar a planilha para o próximo funcionário.")) {
        const status = document.getElementById('status');
        status.innerText = "Encerrando turno e arquivando...";
        
        // Envia o comando para o Script arquivar e limpar
        fetch(scriptURL + '?action=encerrar&nome=' + encodeURIComponent(nome) + '&re=' + encodeURIComponent(re))
        .then(r => r.text())
        .then(res => {
            if (res === "OK") {
                atualizarContador(0);
                status.style.color = "green";
                status.innerText = "✅ Turno Encerrado e Arquivado!";
                alert("Turno encerrado com sucesso!");
                setTimeout(() => { status.innerText = ""; }, 3000);
            } else {
                alert("Erro ao encerrar: " + res);
            }
        })
        .catch(err => alert("Erro de conexão: " + err));
    }
}
</script>

</body>
</html>
